[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seriesquad"
version = "0.1.0"
description = "MuJoCo-first quadruped locomotion: five-bar SEA legs, pure-numpy PPO, bit-exact ONNX export"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "SeriesQuad contributors" },
]
keywords = ["quadruped", "robot-learning", "mujoco", "ppo", "onnx", "series-elastic-actuator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Robotics",
]

dependencies = [
    "mujoco>=3.1",
    "numpy>=1.24",
    "onnx>=1.15",
    "onnxruntime>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
# CLI entry points named after the runnable scripts they wrap.
seriesquad-train = "train_quad:main"
seriesquad-onnx-exact = "run_onnx:main"
seriesquad-export = "export_onnx:main"

[tool.setuptools]
py-modules = ["ppo", "gait_env", "quad_model", "leg_utils", "train_quad", "export_onnx", "run_onnx", "run_quad", "run_single_leg", "gait_demo"]

[tool.setuptools.packages.find]
include = ["seriesquad*"]
where = ["sim/mujoco"]

[tool.setuptools.package-data]
"*" = ["*.xml", "*.onnx", "*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["sim/mujoco"]

[tool.ruff]
line-length = 100
src = ["sim/mujoco", "tests", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF012"]  # mutable class attribute default handled via None in code

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts allowed in tests
"train_quad.py" = ["B008"]  # mutable argparse defaults are clear from CLI names

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
