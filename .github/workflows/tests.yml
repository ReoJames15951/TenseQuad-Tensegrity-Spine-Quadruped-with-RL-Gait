name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project + gates
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "mujoco>=3.13" "numpy>=1.24" onnx onnxruntime pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test (bit-exact + SEA gates)
        run: python -m pytest tests -q
